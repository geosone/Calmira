; GeosOne DOS Installer definition.
[Setup]
Title=Calmira Setup
Product=Calmira Unified
License=LICENSE.TXT
Readme=README.TXT
DefaultDir=%BOOT%\CALMIRA
Done=Calmira is installed. Start CALMIRA.EXE from Windows 3.1.

[Welcome]
Calmira is a Windows 95-style desktop and file manager for Windows 3.1.
This build includes long filename support and the maintained Reborn fixes.

[Options]
Option=?FAT32|Patch Windows 3.1/3.11 WIN386.EXE for DOS 7.1 FAT32
Option=!?LFN|Install a DOSLFN long-filename driver
Option=off|Use compact DOSLFNMS for MS-DOS 7 instead of full DOSLFN
Option=on|Make Calmira the default Windows shell

[Detect]
LFN=LFNPROBE.EXE /Q /LFN %BOOT%\
FAT32=LFNPROBE.EXE /Q /FAT32 %BOOT%\
DOS71=LFNPROBE.EXE /Q /DOS71

