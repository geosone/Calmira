[Welcome]
Experimental long-name file dialogs and read-only ZIP contents.
Independent of any desktop shell; not a DOSLFN filesystem driver.
ZIP preview: enhanced Windows 3.1x on DOS 6.22, 386 or newer.
Windows on DOS 7.x is currently blocked for ZIP helper startup.
No shell replacement, automatic startup, extraction or Windows file patches.

