[Autoexec.bat]
; INSTALL /U takes out the line Add= wrote, wherever Calmira was installed
Remove=%DIR%\DOSLFN\DOSLFN
Add=2,!3|LH %DIR%\DOSLFN\DOSLFN.COM
Add=2,3|LH %DIR%\DOSLFN\DOSLFNMS.COM
Position=top

[System.ini]
Add=2,3|386Enh|device=%DIR%\DOSLFN\LFNXLAT.386
Set=4|boot|shell=%DIR%\CALMIRA.EXE

[ProgMan]
Item=!4|Calmira Reloaded|Calmira Reloaded|%DIR%\CALMIRA.EXE
Item=!4|Calmira Reloaded|Calmira Reloaded Help|WINHELP.EXE %DIR%\CALMIRA.HLP|WINHELP.EXE|0

