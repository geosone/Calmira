; GeosOne DOS Installer definition.
[Setup]
Title=Calmira Reloaded Setup
Product=Calmira Reloaded
Version=5.0.91
License=1,2,3,4,5,6
License1=Calmira|LICENSE.TXT
License2=Open386MAX CTL3D|LICENSES\CTL3D.TXT
License3=File-dialog hook and ZIP viewer|LICENSES\GPL3.TXT
License4=7-Zip notices|LICENSES\7ZIP.TXT
License5=7-Zip LGPL|LICENSES\LGPL21.TXT
License6=DOS32 Advanced DOS Extender|LICENSES\DOS32A.TXT
Readme=README.TXT
DefaultDir=%BOOT%\CALMIRA
MinWindows=3.1
Done=Calmira Reloaded is installed. As the Windows shell it starts with Windows; otherwise start it from its Program Manager group.

[Welcome]
Calmira Reloaded is a Windows 95-style desktop and file manager for
Windows 3.1x: Calmira Reborn 5.0 built with Free Pascal, with long
filename support and its own fixes.

[Options]
Option=?FAT32|Patch Windows 3.1/3.11 WIN386.EXE for DOS 7.1 FAT32
Option=!?LFN|Install a DOSLFN long-filename driver
Option=off|Use compact DOSLFNMS for MS-DOS 7 instead of full DOSLFN
Option=on|Make Calmira the default Windows shell
Option=off|Install OpenLFN Loader and ZIP preview (experimental; DOS 6.22 GUI)

[Detect]
LFN=LFNPROBE.EXE /Q /LFN %BOOT%\
FAT32=LFNPROBE.EXE /Q /FAT32 %BOOT%\
DOS71=LFNPROBE.EXE /Q /DOS71

